name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Check word decks
        run: node scripts/check-decks.mjs --stats
      - run: npm test
      - run: npm run build
      - name: End-to-end test (plays rounds with a fake accelerometer)
        run: |
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node e2e/smoke.mjs http://localhost:4173/ screenshots/ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots/ci/
          retention-days: 14
      - name: Upload web build for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the APK as a release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Use the shared debug signing key
        # Every build signed with the same key installs over the previous one.
        # Without the secret (e.g. forks), Gradle makes a throwaway key.
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk thinking-cap.apk
      - name: Show signing key fingerprint
        run: |
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs thinking-cap.apk | grep SHA-256 | head -1
      - uses: actions/upload-artifact@v7
        with:
          name: thinking-cap-apk
          path: thinking-cap.apk
          retention-days: 30
      - name: Publish as the "latest-build" release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build thinking-cap.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Android APK built from ${GITHUB_SHA::7}. On your phone: download thinking-cap.apk, open it, and allow installing from your browser if asked."
      - name: Publish a versioned release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" thinking-cap.apk --title "$GITHUB_REF_NAME" --generate-notes
